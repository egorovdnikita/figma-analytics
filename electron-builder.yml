appId: com.figmaanalytics.desktop
productName: Figma Analytics
copyright: © 2026 Nikita Egorov
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
afterPack: build/afterPack.cjs

# Своей иконки у приложения нет — берётся стандартная иконка Electron.
# Чтобы вернуть свою: положить icon.png в build/ (electron-builder подхватит
# её из buildResources сам, строка icon: не нужна).

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  darkModeSupport: true
  # Без Apple Developer ID сборка не подписывается настоящим сертификатом.
  # afterPack.cjs ad-hoc подписывает .app, чтобы arm64-сборка не считалась «повреждённой» —
  # см. README, раздел «Первый запуск».
  identity: null
  gatekeeperAssess: false

dmg:
  title: Figma Analytics ${version}
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Figma Analytics

linux:
  category: Office
  target:
    - AppImage

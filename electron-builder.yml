appId: com.figmaanalytics.desktop
productName: Figma Analytics
copyright: © 2026 Nikita Egorov
directories:
  # Суффикс .noindex — чтобы Spotlight не индексировал промежуточные .app
  # внутри: иначе рядом с установленным приложением в поиске всплывали ещё две
  # копии, arm64 и x86_64.
  output: release.noindex
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
afterPack: build/afterPack.cjs

# Иконка — build/icon.png: electron-builder сам берёт её из buildResources и
# собирает .icns/.ico, строка icon: для этого не нужна. Картинка не правится
# руками, а рисуется из дизайн-системы: npx electron scripts/make-icon.mjs.

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  darkModeSupport: true
  # Без Apple Developer ID сборка не подписывается настоящим сертификатом.
  # afterPack.cjs ad-hoc подписывает .app, чтобы arm64-сборка не считалась «повреждённой» —
  # см. README, раздел «Первый запуск».
  identity: null
  gatekeeperAssess: false

dmg:
  title: Figma Analytics ${version}
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Figma Analytics

linux:
  category: Office
  target:
    - AppImage
